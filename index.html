<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thư viện Mây — không gian quản lý sách và mượn trả thân thiện, gọn gàng." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Thư viện Mây · Không gian đọc dịu dàng</title>
    <script>
      // Đặt theme trước khi React chạy để không nháy màn trắng khi đang ở chế độ tối
      try {
        var saved = localStorage.getItem('mini-library:theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
